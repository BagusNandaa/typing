name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Install Chrome
        run: |
          # @puppeteer/browsers installs into the working directory unless --path is set.
          cache_dir="${HOME}/.cache/puppeteer"
          mkdir -p "$cache_dir"
          pnpm dlx @puppeteer/browsers install chrome@stable --path "$cache_dir"
          chrome_bin="$(find "$cache_dir" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          if [ ! -x "$chrome_bin" ]; then
            echo "Chrome binary not found after install" >&2
            exit 1
          fi
          echo "CHROME_PATH=$chrome_bin" >> "$GITHUB_ENV"

      - name: Test
        run: pnpm run test
